name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  mount-mock:
    name: Mount against a mock itch.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y nfs-common
      - run: cargo build --release --bin itch-nfs --example mock_itch
      - name: Serve, mount and validate the fixture pack
        env:
          ITCH_TOKEN: test-token
          ITCH_NFS_API_URL: http://127.0.0.1:8099
          SHOW_NAMES: 1
        run: |
          target/release/examples/mock_itch 127.0.0.1:8099 &
          timeout 10 bash -c 'until (exec 3<>/dev/tcp/127.0.0.1/8099) 2>/dev/null; do sleep 0.1; done'
          ci/mount-and-validate.sh --all --expect ci/mock-expected.txt

  mount-live:
    name: Mount against itch.io
    runs-on: ubuntu-latest
    # Secrets are not available to pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - name: Check for the token
        env:
          ITCH_TOKEN: ${{ secrets.ITCH_TOKEN }}
        run: |
          if [ -z "$ITCH_TOKEN" ]; then
            echo "::error::Add an itch.io API key as the ITCH_TOKEN repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y nfs-common
      - run: cargo build --release --bin itch-nfs
      - name: Serve, mount and validate real packs
        env:
          ITCH_TOKEN: ${{ secrets.ITCH_TOKEN }}
          # Optional repository variables: a pack directory name to validate
          # (default: the smallest of the first 25), and 1 to print pack names.
          PACK: ${{ vars.ITCH_NFS_CI_PACK }}
          SHOW_NAMES: ${{ vars.ITCH_NFS_CI_SHOW_NAMES }}
        run: ci/mount-and-validate.sh ${PACK:+--pack "$PACK"}

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [test, mount-mock, mount-live]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y nfs-common
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            itch-nfs:ci
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Serve the fixture pack from the image, mount and validate
        env:
          ITCH_TOKEN: test-token
          ITCH_NFS_API_URL: http://127.0.0.1:8099
          ITCH_NFS_BIN: ci/run-image.sh
          SHOW_NAMES: 1
        run: |
          cargo build --release --example mock_itch
          target/release/examples/mock_itch 127.0.0.1:8099 &
          timeout 10 bash -c 'until (exec 3<>/dev/tcp/127.0.0.1/8099) 2>/dev/null; do sleep 0.1; done'
          ci/mount-and-validate.sh --all --expect ci/mock-expected.txt
      # Published only from main, and only once every other job has passed.
      - name: Log in to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push --all-tags "ghcr.io/${GITHUB_REPOSITORY,,}"
